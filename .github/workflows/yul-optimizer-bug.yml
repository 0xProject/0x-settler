# Compiles every deployable contract twice, with the stock solc release and with the same release
# patched with the fix for the Yul optimizer's stale KnowledgeBase bookkeeping (solc 0.8.19
# through 0.8.37, fixed in 0.8.38; https://www.soliditylang.org/blog/2026/10/22/yul-optimizer-knowledge-base-stale-bookkeeping-bug/),
# and fails when any bytecode differs. Identical bytecode proves the bug did not influence the
# output. The patched compilers are built from source on first use and kept in the Actions cache.

name: Yul optimizer bug check

on:
  push:
    branches:
      - master
      - fork/cancun
      - fork/shanghai
  pull_request:

permissions:
  contents: read

jobs:
  plan:
    runs-on: ubuntu-latest
    outputs:
      sets: ${{ steps.plan.outputs.sets }}
      versions: ${{ steps.plan.outputs.versions }}
      cache-suffix: ${{ steps.plan.outputs.cache-suffix }}
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.event.pull_request.head.sha }}

      - name: Install Foundry
        uses: foundry-rs/foundry-toolchain@v1
        with:
          version: v1.5.1

      - name: Install dependencies
        run: git submodule update --recursive --init

      - name: Resolve the compiler of every deployable contract
        id: plan
        run: |
          python3 -I .github/yul-optimizer-bug/plan.py
          echo "cache-suffix=${{ hashFiles('.github/yul-optimizer-bug/patches/**', '.github/yul-optimizer-bug/build-patched-solc.sh', '.github/yul-optimizer-bug/verify-patched-solc.sh', '.github/yul-optimizer-bug/repro/**') }}" >> "$GITHUB_OUTPUT"

  solc:
    name: patched solc ${{ matrix.version }}
    needs: plan
    if: needs.plan.outputs.versions != '[]'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        version: ${{ fromJSON(needs.plan.outputs.versions) }}
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.event.pull_request.head.sha }}

      - name: Compute the cache key
        id: key
        run: echo "key=patched-solc-${{ matrix.version }}-${ImageOS:-$RUNNER_OS}-${{ needs.plan.outputs.cache-suffix }}" >> "$GITHUB_OUTPUT"

      - name: Restore the patched solc
        id: restore
        uses: actions/cache/restore@v4
        with:
          path: patched-solc/solc-${{ matrix.version }}
          key: ${{ steps.key.outputs.key }}

      - name: Install build dependencies
        if: steps.restore.outputs.cache-hit != 'true'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends cmake ninja-build libboost-filesystem-dev libboost-program-options-dev libboost-system-dev libboost-test-dev

      - name: Build the patched solc
        if: steps.restore.outputs.cache-hit != 'true'
        run: .github/yul-optimizer-bug/build-patched-solc.sh ${{ matrix.version }} patched-solc/solc-${{ matrix.version }}

      - name: Install Foundry
        if: steps.restore.outputs.cache-hit != 'true'
        uses: foundry-rs/foundry-toolchain@v1
        with:
          version: v1.5.1

      - name: Verify the patched solc against the stock release
        if: steps.restore.outputs.cache-hit != 'true'
        run: .github/yul-optimizer-bug/verify-patched-solc.sh ${{ matrix.version }} patched-solc/solc-${{ matrix.version }}

      - name: Save the patched solc
        if: steps.restore.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: patched-solc/solc-${{ matrix.version }}
          key: ${{ steps.key.outputs.key }}

  check:
    name: ${{ matrix.set.name }}
    needs:
      - plan
      - solc
    if: ${{ !cancelled() && needs.plan.result == 'success' && needs.solc.result != 'failure' }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        set: ${{ fromJSON(needs.plan.outputs.sets) }}
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.event.pull_request.head.sha }}

      - name: Unaffected compiler release
        if: ${{ !matrix.set.affected }}
        run: echo 'solc ${{ matrix.set.solc }} does not have the bug; nothing to compare'

      - name: Install Foundry
        if: matrix.set.affected
        uses: foundry-rs/foundry-toolchain@v1
        with:
          version: v1.5.1

      - name: Install dependencies
        if: matrix.set.affected
        run: git submodule update --recursive --init

      - name: Compute the cache key
        if: matrix.set.affected
        id: key
        run: echo "key=patched-solc-${{ matrix.set.solc }}-${ImageOS:-$RUNNER_OS}-${{ needs.plan.outputs.cache-suffix }}" >> "$GITHUB_OUTPUT"

      - name: Restore the patched solc
        if: matrix.set.affected
        uses: actions/cache/restore@v4
        with:
          path: patched-solc/solc-${{ matrix.set.solc }}
          key: ${{ steps.key.outputs.key }}
          fail-on-cache-miss: true

      - name: Compare stock and patched bytecode
        if: matrix.set.affected
        run: .github/yul-optimizer-bug/check-set.sh
        env:
          SET_PATHS: ${{ matrix.set.paths }}
          SET_EVM: ${{ matrix.set.evm }}
          SET_RUNS: ${{ matrix.set.runs }}
          PATCHED_SOLC: patched-solc/solc-${{ matrix.set.solc }}
