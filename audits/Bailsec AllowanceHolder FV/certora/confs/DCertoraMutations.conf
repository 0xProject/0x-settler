{
    "files": [
        "certora/harnesses/AllowanceHolderHarness.sol",
        "certora/helpers/MockCallbackTarget.sol",
        "certora/helpers/MockActiveCallbackTarget.sol",
    ],
    "solc": "solc0.8.25",
    "verify": "AllowanceHolderHarness:certora/specs/AllowanceHolder_main.spec",
    "msg": "MUTATIONS - AllowanceHolder.sol generate 10 and verify",
    "rule_sanity": "basic",
    "optimistic_loop": true,
    "loop_iter": 3,
    "optimistic_hashing": true,
    // multi_assert_check disabled: its auto-generated checks false-positive on recursive dispatch
    "build_cache": true,
    "prover_args": [
        "-enableStorageSplitting false"
    ],
    "optimistic_fallback": true,
    "optimistic_summary_recursion": true,
    "summary_recursion_limit": 3,
    "link": [
        "MockActiveCallbackTarget:allowanceHolder=AllowanceHolderHarness"
    ],
    "parametric_contracts": ["AllowanceHolderHarness"],
      "packages": [
        "@solmate=lib/solmate/src",
        "@permit2=lib/permit2/src",
        "@forge-std=lib/forge-std/src",
        "forge-std/src=lib/forge-std/src",
        "solmate=lib/solmate",
        "openzeppelin-contracts=lib/openzeppelin-contracts/contracts"
    ],


    // Mutation object: only `gambit`, `manual_mutants`, and `msg` are valid keys.
    // Generated mutants are kept by default in `gambit_out/` (raw mutant .sol files
    // + patches), and the per-mutant Prover setups land in
    // `.certora_internal/applied_mutants_dir`, which can be re-run with certora-run.
    "mutations": {
    "manual_mutants": [
        {
            "file_to_mutate": "src/allowanceholder/AllowanceHolderBase.sol",
            "mutants_location": "certora/mutants/AllowanceHolderBase"
        },
        
    ],
    "msg": "Reuse mutants from certora/mutants/"
}
}
